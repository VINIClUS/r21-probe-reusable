name: r24-secret-probe-reusable

on:
  workflow_call:
    secrets:
      PROBE_GOV:
        description: Mirrors CNESDATA_DELIVERY_GOVERNANCE, passed by name from the caller
        required: true

permissions: {}

jobs:
  env-job:
    runs-on: ubuntu-latest
    environment: probe-env
    timeout-minutes: 5
    env:
      PROBE_GOV: ${{ secrets.PROBE_GOV }}
      PROBE_LABEL: env-job
    steps:
      - name: report
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          value = os.environ.get("PROBE_GOV", "").encode()
          record = {"label": os.environ["PROBE_LABEL"], "length": len(value),
                    "sha256": hashlib.sha256(value).hexdigest()}
          print("PROBE " + json.dumps(record, sort_keys=True), flush=True)
          PY
  noenv-job:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROBE_GOV: ${{ secrets.PROBE_GOV }}
      PROBE_LABEL: noenv-job
    steps:
      - name: report
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          value = os.environ.get("PROBE_GOV", "").encode()
          record = {"label": os.environ["PROBE_LABEL"], "length": len(value),
                    "sha256": hashlib.sha256(value).hexdigest()}
          print("PROBE " + json.dumps(record, sort_keys=True), flush=True)
          PY
